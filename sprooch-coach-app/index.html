<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0082B8" />
    <meta name="description" content="Préparer l'oral du Sproochentest : on répond à voix haute, jamais par écrit." />
    <title>Sprooch Coach</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('sproochcoach.app.v1') || '{}').settings || {};
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
        if (s.fontScale) document.documentElement.style.fontSize = s.fontScale * 100 + '%';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
